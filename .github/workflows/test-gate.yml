name: Test Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ─────────────────────────────────────────────────────────
  # Unit tests — no backend required, runs on any Ubuntu runner
  # ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        # Repo root = EraMatch/ — backend/ is a direct child
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/ --quiet
          pip install pytest pytest-asyncio httpx --quiet

      - name: Run unit tests
        run: |
          python -m pytest \
            tests/candidate-view/unit_testing/testing_functionality/test_assessment_score_calculation.py \
            tests/candidate-view/unit_testing/testing_functionality/test_live_interview_judge_output.py \
            tests/candidate-view/unit_testing/testing_functionality/test_recorded_interview_pipeline.py \
            tests/candidate-view/unit_testing/testing_functionality/test_judge_grading_logic.py \
            tests/candidate-view/unit_testing/testing_functionality/test_coding_solve_simulation.py \
            -v --tb=short --no-header -q

  # ─────────────────────────────────────────────────────────
  # Frontend builds — verify both portals compile
  # ─────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        portal:
          - path: Frontend/recruiter-portal
            name: recruiter-portal
          - path: Frontend/candidate-portal
            name: candidate-portal

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.portal.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.portal.path }}
        run: npm ci --silent

      - name: Build ${{ matrix.portal.name }}
        working-directory: ${{ matrix.portal.path }}
        run: npm run build
        env:
          CI: "true"

  # ─────────────────────────────────────────────────────────
  # TypeScript type check
  # ─────────────────────────────────────────────────────────
  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        portal:
          - path: Frontend/recruiter-portal
            name: recruiter-portal
          - path: Frontend/candidate-portal
            name: candidate-portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.portal.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.portal.path }}
        run: npm ci --silent

      - name: Type check ${{ matrix.portal.name }}
        working-directory: ${{ matrix.portal.path }}
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────
  # Integration tests — self-hosted runner (your dev machine)
  # The runner already has:
  #   - backend/.venv with all deps installed
  #   - backend/.env and ai-service/.env with real DB/API keys
  #   - Redis running (brew services start redis)
  #   - Backend server started separately (bash start-dev.sh)
  #
  # Triggered on: push/PR to main or dev, OR when "integration-test" label added to PR
  #
  # HOW TO SET UP THE SELF-HOSTED RUNNER:
  #   Go to: GitHub repo → Settings → Actions → Runners → New self-hosted runner
  #   Follow the instructions to install and register the runner on your machine.
  #   The runner will use your local backend .venv, .env files, and running services.
  # ─────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests (self-hosted)
    runs-on: self-hosted
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev' ||
      contains(github.event.pull_request.labels.*.name, 'integration-test')

    env:
      # Set these as GitHub repo secrets:
      # Settings → Secrets and variables → Actions → New repository secret
      #   TEST_CANDIDATE_USERNAME  →  the candidate's username (from credentials email)
      #   TEST_CANDIDATE_PASSWORD  →  the candidate's password (from credentials email)
      # Your backend .env and ai-service/.env stay local — never push them.
      TEST_CANDIDATE_USERNAME: ${{ secrets.TEST_CANDIDATE_USERNAME }}
      TEST_CANDIDATE_PASSWORD: ${{ secrets.TEST_CANDIDATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Wait for backend to be ready
        run: |
          echo "Checking backend on :8000..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/ >/dev/null 2>&1; then
              echo "Backend is up."
              break
            fi
            echo "  attempt $i — waiting 3s..."
            sleep 3
          done

      - name: Run recruiter-side integration tests
        run: |
          backend/.venv/bin/python3 -m pytest \
            tests/recruiter-view/unit_testing/testing_functionality/test_assessment_config_full.py \
            -v --tb=short --no-header

      - name: Run candidate-side integration tests
        # continue-on-error so a skip (no candidate creds) doesn't block the pipeline
        continue-on-error: true
        run: |
          backend/.venv/bin/python3 -m pytest \
            tests/candidate-view/unit_testing/testing_functionality/test_candidate_full_cycle.py \
            tests/candidate-view/unit_testing/testing_functionality/test_recorded_interview_api.py \
            -v --tb=short --no-header
