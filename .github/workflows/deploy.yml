name: Deploy EraMatch (Dev)

on:
  push:
    branches: [ dev-release-2.0 ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - name: Update Code and Restart
        env:
          RUNNER_TRACKING_ID: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ~/EraMatch
          # Authenticate git with the temporary workflow token
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          
          # Update to latest version
          git fetch origin dev-release-2.0
          git reset --hard origin/dev-release-2.0
          
          # Restart services
          ./start.sh stop || true
          mkdir -p .logs
          nohup ./start.sh --tunnel > .logs/deploy.log 2>&1 & disown
          
          echo "Deployment complete on VM."
