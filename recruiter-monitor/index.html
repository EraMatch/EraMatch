<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Interview Results Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }
        
        #status {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .log-entry {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #00d4ff;
        }
        
        .log-entry.completed {
            border-left-color: #00ff88;
        }
        
        .log-entry.error {
            border-left-color: #ff4757;
        }
        
        .log-entry .timestamp {
            color: #888;
            font-size: 12px;
            margin-bottom: 8px;
        }
        
        .log-entry .step {
            color: #00d4ff;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .log-entry .data {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            overflow-x: auto;
        }
        
        .response-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .response-card h3 {
            color: #00d4ff;
            margin-bottom: 15px;
        }
        
        .score {
            font-size: 2rem;
            font-weight: bold;
            color: #00ff88;
        }
        
        .transcript {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-style: italic;
        }
        
        .feedback {
            margin-top: 10px;
            padding: 10px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 8px;
        }
        
        #logs {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 Video Interview Results Monitor</h1>
        <p style="margin-bottom: 20px; color: #888;">Developer debugging view for video interview processing</p>
        
        <div class="controls">
            <button onclick="fetchLogs()">🔄 Refresh Logs</button>
            <button onclick="fetchResponses()">📊 Fetch Responses</button>
            <button onclick="clearLogs()">🗑️ Clear Logs</button>
        </div>
        
        <div id="status">
            <strong>Status:</strong> <span id="statusText">Ready</span>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="showTab('logs')">Processing Logs</div>
            <div class="tab" onclick="showTab('responses')">Interview Responses</div>
        </div>
        
        <div id="logsTab" class="tab-content active">
            <h2 style="margin-bottom: 15px;">📝 Processing Logs</h2>
            <div id="logs">
                <div class="empty-state">No logs yet. Submit a video response to see processing logs.</div>
            </div>
        </div>
        
        <div id="responsesTab" class="tab-content">
            <h2 style="margin-bottom: 15px;">📊 Interview Responses</h2>
            <div id="responses">
                <div class="empty-state">No responses yet.</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            if (tab === 'logs') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('logsTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('responsesTab').classList.add('active');
            }
        }
        
        async function fetchLogs() {
            document.getElementById('statusText').textContent = 'Fetching logs...';
            
            try {
                const response = await fetch(`${API_BASE}/debug/video-processing?limit=50`);
                const data = await response.json();
                
                if (data.logs && data.logs.length > 0) {
                    const logsHtml = data.logs.reverse().map(log => {
                        const stepClass = log.step.includes('completed') ? 'completed' : 
                                         log.step.includes('error') ? 'error' : '';
                        return `
                            <div class="log-entry ${stepClass}">
                                <div class="timestamp">${new Date(log.timestamp).toLocaleString()}</div>
                                <div class="step">${log.step}</div>
                                <div class="data">${JSON.stringify(log.data, null, 2)}</div>
                            </div>
                        `;
                    }).join('');
                    
                    document.getElementById('logs').innerHTML = logsHtml;
                    document.getElementById('statusText').textContent = `Loaded ${data.logs.length} logs`;
                } else {
                    document.getElementById('logs').innerHTML = '<div class="empty-state">No logs yet.</div>';
                    document.getElementById('statusText').textContent = 'No logs found';
                }
            } catch (error) {
                document.getElementById('statusText').textContent = `Error: ${error.message}`;
            }
        }
        
        async function fetchResponses() {
            document.getElementById('statusText').textContent = 'Fetching responses...';
            
            // This would require a session_id - for now show mock data
            document.getElementById('responses').innerHTML = `
                <div class="empty-state">
                    <p>Enter a session ID to view responses:</p>
                    <input type="text" id="sessionId" placeholder="Session ID" style="padding: 10px; margin: 10px; border-radius: 4px; border: 1px solid #333; background: #1a1a2e; color: white;">
                    <button onclick="fetchSessionResponses()">Fetch</button>
                </div>
            `;
            document.getElementById('statusText').textContent = 'Ready';
        }
        
        async function fetchSessionResponses() {
            const sessionId = document.getElementById('sessionId').value;
            if (!sessionId) return;
            
            // Get a token first (for demo purposes)
            try {
                const loginRes = await fetch(`${API_BASE}/candidate/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'amy18@example.org', password: 'candidate123' })
                });
                const loginData = await loginRes.json();
                const token = loginData.access_token;
                
                const response = await fetch(`${API_BASE}/interview/status/${sessionId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.responses && data.responses.length > 0) {
                    const responsesHtml = data.responses.map(r => `
                        <div class="response-card">
                            <h3>Q${r.question_order}: ${r.question_text}</h3>
                            <div class="score">Score: ${r.score ? r.score + '/100' : 'Processing...'}</div>
                            <div class="status">Status: ${r.status}</div>
                            ${r.transcript ? `<div class="transcript">"${r.transcript}"</div>` : ''}
                            ${r.feedback ? `<div class="feedback">${typeof r.feedback === 'string' ? r.feedback : JSON.stringify(r.feedback)}</div>` : ''}
                        </div>
                    `).join('');
                    document.getElementById('responses').innerHTML = responsesHtml;
                }
            } catch (error) {
                document.getElementById('statusText').textContent = `Error: ${error.message}`;
            }
        }
        
        async function clearLogs() {
            try {
                await fetch(`${API_BASE}/debug/video-processing`, { method: 'DELETE' });
                document.getElementById('logs').innerHTML = '<div class="empty-state">Logs cleared.</div>';
                document.getElementById('statusText').textContent = 'Logs cleared';
            } catch (error) {
                document.getElementById('statusText').textContent = `Error: ${error.message}`;
            }
        }
        
        // Auto-refresh every 5 seconds
        setInterval(fetchLogs, 5000);
        
        // Initial load
        fetchLogs();
    </script>
</body>
</html>
